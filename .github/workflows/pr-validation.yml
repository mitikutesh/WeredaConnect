name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Permissions needed for paths-filter to read PR files
permissions:
  contents: read
  pull-requests: read

jobs:
  # Determine which components changed
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      server: ${{ steps.filter.outputs.server }}
      infra: ${{ steps.filter.outputs.infra }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate change detection

      - name: Check for changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
            server:
              - 'server/**'
            infra:
              - 'infra/**'

  # Mobile tests
  mobile-tests:
    name: Mobile Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-tests.yml

  # Server tests
  server-tests:
    name: Server Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    uses: ./.github/workflows/server-tests.yml

  # Infrastructure tests
  infra-tests:
    name: Infrastructure Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    uses: ./.github/workflows/infra-tests.yml

  # E2E tests (run if mobile OR server changed)
  e2e-tests:
    name: E2E Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true' || needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3,lambda,apigateway
          LAMBDA_EXECUTOR: local
          DEBUG: 1
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner image ships several GB of toolchains this job never uses. With
      # Flutter, .NET, Java, the Android SDK/NDK, Gradle caches and a LocalStack
      # container sharing one disk, the debug APK build has died with "No space
      # left on device" on every run since late July. Everything removed here is
      # either unused or reinstalled by the setup actions below (the hosted tool
      # cache is repopulated by the Flutter and Java actions; setup-dotnet
      # reinstalls the SDK). The Android SDK and NDK are deliberately kept.
      - name: Free runner disk space
        run: |
          echo "Disk before:" && df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/az /usr/lib/google-cloud-sdk \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "Disk after:" && df -h / | tail -1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      # Maestro CLI comes from a pinned GitHub release and is checked against a
      # hard-coded SHA-256 before anything in it runs (CI-01). The vendor
      # installer script is not used: it pulls "latest" and runs unverified code
      # on a runner in a repo whose deploy jobs hold AWS credentials.
      # To upgrade, set both values together. Get the digest with
      #   gh api repos/mobile-dev-inc/maestro/releases/tags/cli-<version> \
      #     --jq '.assets[] | select(.name=="maestro.zip") | .digest'
      # and confirm it against a local download (sha256sum maestro.zip).
      - name: Install Maestro CLI (pinned, SHA-256 verified)
        env:
          MAESTRO_VERSION: '2.10.0'
          MAESTRO_SHA256: '29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991'
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/maestro.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  ${zip}" | sha256sum --check --strict -
          rm -rf "$HOME/.maestro" "$RUNNER_TEMP/maestro"
          unzip -q "$zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/maestro" "$HOME/.maestro"
          rm -f "$zip"
          "$HOME/.maestro/bin/maestro" --version
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Wait for LocalStack
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:4566/_localstack/health; do sleep 2; done'

      - name: Deploy server to LocalStack
        working-directory: server
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          dotnet restore
          dotnet build --configuration Release
          # Deploy Lambda functions to LocalStack
          # TODO: Add deployment script

      - name: Get mobile dependencies
        working-directory: mobile
        run: |
          for i in 1 2 3; do
            flutter pub get && break
            echo "Attempt $i failed, retrying in 5s..." && sleep 5
          done

      - name: Run code generation
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run E2E tests with Maestro
        working-directory: mobile
        env:
          API_BASE_URL: http://10.0.2.2:4566
        run: |
          # Build APK for E2E testing
          flutter build apk --debug --dart-define=API_BASE_URL=$API_BASE_URL

          # Run Maestro E2E tests
          # maestro test .maestro/

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: mobile/.maestro/results/
          retention-days: 7

  # Secret scanning (always runs, not gated by path changes)
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Security-relevant source-code lints (S1-04 onward). Cheap shell
  # checks that run on every PR regardless of path filter.
  security-lints:
    name: Security Lints
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint — legacyPlaintextAllowed flag (S1-04)
        run: bash scripts/check_legacy_plaintext_flag.sh

      - name: Lint — self-test fixtures
        run: bash scripts/check_legacy_plaintext_flag.sh --self-test

      - name: "Lint: no pipe-to-shell installs in CI (CI-01)"
        run: bash scripts/check_no_pipe_to_shell.sh

      - name: "Lint: pipe-to-shell guard self-test"
        run: bash scripts/check_no_pipe_to_shell.sh --self-test

  # Final validation check
  pr-validation-complete:
    name: PR Validation Complete
    needs: [detect-changes, mobile-tests, server-tests, infra-tests, e2e-tests, secret-scan, security-lints]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check all jobs status
        run: |
          echo "Mobile Tests: ${{ needs.mobile-tests.result }}"
          echo "Server Tests: ${{ needs.server-tests.result }}"
          echo "Infra Tests: ${{ needs.infra-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "Security Lints: ${{ needs.security-lints.result }}"

          # Path-conditional jobs (mobile-tests, server-tests, infra-tests,
          # e2e-tests) can be legitimately 'skipped' when their paths
          # weren't touched — only explicit 'failure' is fatal for those.
          #
          # The unconditional security jobs (secret-scan, security-lints)
          # MUST produce 'success'. Treating 'cancelled' or 'skipped' as
          # acceptable here would let a workflow-cancellation or
          # misconfiguration bypass the security gate.
          if [[ "${{ needs.mobile-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.server-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.infra-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.security-lints.result }}" != "success" ]]; then
            echo "❌ One or more required jobs failed or were not successful"
            exit 1
          fi

          echo "✅ All test suites passed!"
