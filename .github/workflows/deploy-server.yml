name: Deploy Server (.NET AOT + CDK)

# Deploys the server Lambdas + infrastructure via CDK. This is the piece the
# pipeline was missing: pushes to main previously deployed only the web app and
# ran server *tests* — the server itself was deployed by hand, so fixes lagged.
#
# Why this is not a plain `cdk deploy`: the CDK Lambda asset
# (infra/lib/constructs/lambda-construct.ts) writes a PLACEHOLDER bootstrap when
# CI=true (GitHub Actions sets that), and its real bundling emulates ARM64 .NET
# (slow/flaky). So we cross-compile the real bootstrap on the runner (the same
# fast method as the aot-validation job) and hand it to CDK via
# LAMBDA_BOOTSTRAP_PATH, which the construct copies in verbatim.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: deploy-server-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build AOT & Deploy Server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ github.event.inputs.environment || 'dev' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ARM64 cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Run server unit tests (gate)
        working-directory: server
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet test --no-build --configuration Release --filter "Category!=Integration"

      - name: Cross-compile Native AOT bootstrap (linux-arm64)
        working-directory: server
        env:
          COMPlus_CrossCompiling: '1'
          OBJCOPY: aarch64-linux-gnu-objcopy
        run: |
          dotnet publish WeredaConnect.Server.csproj \
            -c Release /p:PublishAot=true /p:RuntimeIdentifier=linux-arm64 /p:StripSymbols=false
          PUB="bin/Release/net10.0/linux-arm64/publish"
          # The native binary may be named `bootstrap` or `WeredaConnect.Server`
          # depending on the publish path — normalise to `bootstrap`.
          if [[ ! -f "$PUB/bootstrap" && -f "$PUB/WeredaConnect.Server" ]]; then
            cp "$PUB/WeredaConnect.Server" "$PUB/bootstrap"
          fi
          chmod +x "$PUB/bootstrap"
          file "$PUB/bootstrap"
          ls -la "$PUB/bootstrap"

      - name: Set AWS region
        id: region
        run: |
          if [[ "${{ github.event.inputs.environment || 'dev' }}" == "dev" ]]; then
            echo "region=eu-north-1" >> "$GITHUB_OUTPUT"
          else
            echo "region=me-south-1" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.region.outputs.region }}

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      # Non-prod secrets live in SSM Parameter Store (free) instead of Secrets
      # Manager. Ordering here is load-bearing:
      #   1. Deploy ONLY the GithubActions stack so the seed step's IAM grants
      #      (ssm:PutParameter + legacy secretsmanager:GetSecretValue) exist —
      #      under `--all` that stack deploys last, after the seed step needs it.
      #   2. Seed/copy-verify the SSM parameters. A failure aborts the job
      #      BEFORE the full deploy can remove the legacy Secrets Manager
      #      secrets from the template (CloudFormation force-deletes them with
      #      NO recovery window).
      #   3. Then the normal full deploy.
      - name: Deploy CI role grants needed by the seed step (non-prod)
        if: ${{ (github.event.inputs.environment || 'dev') != 'prod' }}
        working-directory: infra
        env:
          LAMBDA_BOOTSTRAP_PATH: ${{ github.workspace }}/server/bin/Release/net10.0/linux-arm64/publish/bootstrap
        run: |
          npx cdk deploy WeredaConnect-${{ github.event.inputs.environment || 'dev' }}-GithubActions \
            --exclusively \
            --context environment=${{ github.event.inputs.environment || 'dev' }} \
            --require-approval never

      - name: Seed SSM secrets (non-prod)
        if: ${{ (github.event.inputs.environment || 'dev') != 'prod' }}
        run: ./scripts/seed-ssm-secrets.sh ${{ github.event.inputs.environment || 'dev' }}

      - name: CDK deploy (server + infrastructure)
        working-directory: infra
        env:
          # Hand CDK the real cross-compiled bootstrap so it does NOT fall back
          # to the CI placeholder (see lambda-construct.ts tryBundle).
          LAMBDA_BOOTSTRAP_PATH: ${{ github.workspace }}/server/bin/Release/net10.0/linux-arm64/publish/bootstrap
        run: |
          npx cdk deploy --all \
            --context environment=${{ github.event.inputs.environment || 'dev' }} \
            --require-approval never \
            --outputs-file "${{ github.workspace }}/cdk-outputs.json"

      # Dev only (SIM-18): make sure the dashboard's test admin exists in the
      # AdminUserPool. The pool/client ids come from the outputs of the deploy
      # that just ran, so a replaced pool is seeded as well. The admin app is
      # built from the COGNITO_ADMIN_* GitHub secrets (deploy-admin.yml), so
      # the step warns when the secret has drifted from the deployed pool.
      - name: Seed the dashboard admin user (dev only, idempotent)
        if: ${{ (github.event.inputs.environment || 'dev') == 'dev' }}
        env:
          REGION: ${{ steps.region.outputs.region }}
          SEED_ADMIN_STRICT: 'true'
          SECRET_ADMIN_POOL_ID: ${{ secrets.COGNITO_ADMIN_USER_POOL_ID }}
        run: |
          read_output() {
            python3 -c "import json,sys; d=json.load(open('cdk-outputs.json')); print(next(v[sys.argv[1]] for v in d.values() if sys.argv[1] in v))" "$1"
          }
          ADMIN_USER_POOL_ID="$(read_output AdminUserPoolId)"
          ADMIN_CLIENT_ID="$(read_output AdminClientId)"
          export ADMIN_USER_POOL_ID ADMIN_CLIENT_ID
          echo "AdminUserPoolId=$ADMIN_USER_POOL_ID AdminClientId=$ADMIN_CLIENT_ID"
          if [ -n "$SECRET_ADMIN_POOL_ID" ] && [ "$SECRET_ADMIN_POOL_ID" != "$ADMIN_USER_POOL_ID" ]; then
            echo "::warning::GitHub secret COGNITO_ADMIN_USER_POOL_ID differs from the deployed AdminUserPoolId ($ADMIN_USER_POOL_ID). The admin app is built against a stale pool: update the secret and re-run deploy-admin.yml."
          fi
          ./scripts/seed-admin-user.sh

      # Dev only: log in as that admin and read every dashboard endpoint
      # (stats, users, escrows, transactions, audit, fraud signals, disputes,
      # health, compliance, analytics). Non-blocking: the deploy stays green,
      # the functional result is in this run's log.
      - name: Admin dashboard API e2e (dev only, non-blocking)
        if: ${{ (github.event.inputs.environment || 'dev') == 'dev' }}
        continue-on-error: true
        env:
          REGION: ${{ steps.region.outputs.region }}
        run: |
          read_output() {
            python3 -c "import json,sys; d=json.load(open('cdk-outputs.json')); print(next(v[sys.argv[1]] for v in d.values() if sys.argv[1] in v))" "$1"
          }
          python3 scripts/e2e_admin.py \
            --base-url "$(read_output ApiUrl)" \
            --client-id "$(read_output AdminClientId)" \
            --region "$REGION"
