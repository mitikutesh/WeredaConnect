# GitHub Actions Workflow: Server Tests
# Purpose: Run .NET server tests with LocalStack integration
# Trigger: Push to main, pull requests, or manual dispatch

name: Server Tests (.NET 10)

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**'
  workflow_dispatch:
  workflow_call:  # Allow this workflow to be called from pr-validation.yml

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: ./server
        run: dotnet restore

      - name: Build
        working-directory: ./server
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        working-directory: ./server
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: server/tests/TestResults/*.trx

  integration-tests:
    name: Integration Tests (LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3
          DEBUG: 1
          DISABLE_EVENTS: 1
          DEFAULT_REGION: us-east-1
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: ./server
        run: dotnet restore

      - name: Build
        working-directory: ./server
        run: dotnet build --no-restore --configuration Release

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:4566/_localstack/health; do sleep 2; done'

      - name: Run integration tests
        working-directory: ./server
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          # The real-DynamoDB tests skip without an endpoint; here they must run, so a
          # missing endpoint fails them instead of skipping them.
          REQUIRE_LOCALSTACK: "true"
        run: dotnet test --no-build --configuration Release --filter "Category=Integration" --logger "trx;LogFileName=integration-test-results.trx"

      - name: Fail when no integration test ran
        working-directory: ./server
        run: |
          TRX=tests/TestResults/integration-test-results.trx
          EXECUTED=$(grep -o 'executed="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9][0-9]*' || echo 0)
          echo "Integration tests executed: ${EXECUTED}"
          if [ "${EXECUTED}" -eq 0 ]; then
            echo "::error::The LocalStack job ran no integration tests."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: server/tests/TestResults/*.trx

  aot-validation:
    name: AOT Compatibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: ./server
        run: dotnet restore

      # The same build as deploy-server.yml (keep the two in step): Microsoft's
      # cross-build image links against an old-glibc arm64 sysroot, because Lambda
      # provided.al2023 has glibc 2.34 and the runner has 2.39 (fmod@GLIBC_2.38 took
      # every dev function down on 2026-10-31). The runner's SDK is mounted in.
      - name: Validate AOT compatibility (linux-arm64, old-glibc sysroot)
        working-directory: ./server
        env:
          AOT_CROSS_IMAGE: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-arm64
        run: |
          mkdir -p "$HOME/.nuget/packages"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/server" \
            -v "$DOTNET_ROOT:/opt/dotnet:ro" -e DOTNET_ROOT=/opt/dotnet \
            -v "$HOME/.nuget/packages:$HOME/.nuget/packages" -e NUGET_PACKAGES="$HOME/.nuget/packages" \
            -e HOME=/tmp -e DOTNET_CLI_HOME=/tmp -e DOTNET_NOLOGO=1 \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
            "$AOT_CROSS_IMAGE" \
            /opt/dotnet/dotnet publish WeredaConnect.Server.csproj \
              -c Release /p:PublishAot=true /p:RuntimeIdentifier=linux-arm64 /p:StripSymbols=false \
              /p:SysRoot=/crossrootfs/arm64 /p:LinkerFlavor=lld
          PUB="bin/Release/net10.0/linux-arm64/publish"
          if [[ ! -f "$PUB/bootstrap" && -f "$PUB/WeredaConnect.Server" ]]; then
            cp "$PUB/WeredaConnect.Server" "$PUB/bootstrap"
          fi
          chmod +x "$PUB/bootstrap"
          file "$PUB/bootstrap"

      - name: Check the bootstrap needs at most glibc 2.34 (Lambda provided.al2023)
        working-directory: ./server
        run: |
          BIN="bin/Release/net10.0/linux-arm64/publish/bootstrap"
          max="$(readelf -W --version-info "$BIN" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sed 's/^GLIBC_//' | sort -uV | tail -1)"
          if [ -z "$max" ]; then
            echo "::error::could not read the glibc symbol versions of $BIN"
            exit 1
          fi
          echo "Highest glibc symbol version the bootstrap needs: $max"
          if [ "$(printf '%s\n' "$max" 2.34 | sort -V | tail -1)" != "2.34" ]; then
            echo "::error::the bootstrap needs glibc $max but Lambda provided.al2023 has 2.34"
            readelf -W --dyn-syms "$BIN" | grep -E 'GLIBC_2\.(3[5-9]|[4-9][0-9])' || true
            exit 1
          fi

      # Starts the bootstrap the way Lambda does (the provided.al2023 image and its
      # runtime interface emulator, arm64 under QEMU, Lambda's globalization env) and
      # invokes the health check. Catches anything that stops it starting on Lambda's OS.
      - name: Boot the bootstrap in the Lambda provided.al2023 image
        working-directory: ./server
        run: |
          PUB="$PWD/bin/Release/net10.0/linux-arm64/publish"
          docker run -d --name al2023-boot --platform linux/arm64 -p 9000:8080 \
            -v "$PUB:/var/runtime:ro" -e FUNCTION_HANDLER=HealthCheckFunction \
            -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
            public.ecr.aws/lambda/provided:al2023 bootstrap
          # Docker's port proxy accepts before the emulator listens and answers an
          # empty reply, which only --retry-all-errors retries.
          out="$(curl -s --retry 30 --retry-all-errors --retry-delay 2 -m 120 \
            http://localhost:9000/2015-03-31/functions/function/invocations -d '{}')" || true
          echo "health check answered: $out"
          docker logs al2023-boot 2>&1 | tail -30
          docker rm -f al2023-boot >/dev/null
          if ! grep -qiE '"statusCode": ?200' <<<"$out"; then
            echo "::error::the bootstrap did not start in the Lambda provided.al2023 image"
            exit 1
          fi

      - name: Check binary size
        working-directory: ./server
        run: |
          BINARY_SIZE=$(du -h bin/Release/net10.0/linux-arm64/publish/bootstrap | cut -f1)
          echo "Native AOT binary size: $BINARY_SIZE"
          echo "::notice::Native AOT binary size (ARM64): $BINARY_SIZE"

  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: ./server
        run: dotnet restore

      - name: Check for vulnerable packages
        working-directory: ./server
        run: |
          echo "Scanning NuGet packages for known vulnerabilities..."
          OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1) || true
          echo "$OUTPUT"

          # Accepted advisories, by exact id. Each needs its reason and goes
          # when the package is upgraded.
          # - SixLabors.ImageSharp 3.1.12 (crop photo processor,
          #   crop-listing-api 1.6.0): the Highs are the TIFF codecs and
          #   HistogramEqualization, and the BigTIFF Moderate; the processor
          #   registers only the JPEG, PNG and WebP decoders and never
          #   equalizes. The ICC CLUT Moderate (gwg2) is one oversized
          #   allocation, capped by the Lambda's memory, on the uploader's own
          #   photo. Fixed in 3.2.0, which needs a Six Labors license key at
          #   build time (follow-up in crop-photos-architecture.md).
          ACCEPTED="GHSA-v76p-62qx-wwq2|GHSA-gwg2-r3hj-4w44|GHSA-j3p4-wp97-rph4|GHSA-j9gm-c75j-xc9q|GHSA-wmxv-xphr-5c9g|GHSA-jjfr-hcj7-qf5w"
          REMAINING=$(echo "$OUTPUT" | grep -Ev "$ACCEPTED" || true)

          # Fail on critical or high severity vulnerabilities
          if echo "$REMAINING" | grep -qi "Critical\|High"; then
            echo "::error::Critical or High severity vulnerabilities found in NuGet packages"
            exit 1
          fi

          echo "No critical/high vulnerabilities found."

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: ./server
        run: dotnet restore

      - name: Run tests with coverage
        working-directory: ./server
        run: dotnet test --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./server/coverage/**/coverage.cobertura.xml
          flags: server
          name: server-coverage
