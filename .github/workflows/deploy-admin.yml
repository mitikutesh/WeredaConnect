name: Deploy Admin Dashboard (Vite)

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: deploy-admin-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'dev' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build Vite app
        working-directory: admin
        run: npm run build
        env:
          VITE_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          # Value = AdminUserPoolId stack output (NOT the main UserPoolId) —
          # the admin SPA authenticates against the dedicated AdminUserPool.
          VITE_COGNITO_ADMIN_USER_POOL_ID: ${{ secrets.COGNITO_ADMIN_USER_POOL_ID }}
          VITE_COGNITO_ADMIN_CLIENT_ID: ${{ secrets.COGNITO_ADMIN_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ secrets.COGNITO_REGION }}

      - name: Set AWS region
        id: region
        run: |
          if [[ "${{ github.event.inputs.environment || 'dev' }}" == "dev" ]]; then
            echo "region=eu-north-1" >> $GITHUB_OUTPUT
          else
            echo "region=me-south-1" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.region.outputs.region }}

      - name: Sync to S3
        run: |
          aws s3 sync admin/dist/ s3://${{ secrets.ADMIN_S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp admin/dist/index.html \
            s3://${{ secrets.ADMIN_S3_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.ADMIN_CF_DISTRIBUTION_ID }} \
            --paths "/index.html"
