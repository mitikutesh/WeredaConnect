name: Infrastructure Tests (CDK)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-tests.yml'
  push:
    branches: [main, develop]
    paths:
      - 'infra/**'
  workflow_call:  # Allow this workflow to be called from pr-validation.yml

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Create Lambda asset placeholder
        run: mkdir -p server/bin/Release/net10.0/linux-arm64/publish

      - name: Run linter
        working-directory: infra
        run: npm run lint

      - name: Run unit tests
        working-directory: infra
        run: npm test -- --coverage --testPathPatterns=unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./infra/coverage/lcov.info
          flags: infra-unit
          name: infra-unit-tests
          fail_ci_if_error: false

  snapshot-tests:
    name: Snapshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Run snapshot tests
        working-directory: infra
        run: npm test -- --testPathPatterns=snapshot

      - name: Check for snapshot changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only | grep -q "\.snap$"; then
            echo "⚠️ Snapshot files have changed. Please review carefully."
            git diff --name-only | grep "\.snap$"
          fi

  synth-validation:
    name: CDK Synth Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Create Lambda asset placeholder
        run: mkdir -p server/bin/Release/net10.0/linux-arm64/publish

      - name: Build TypeScript
        working-directory: infra
        run: npm run build

      - name: Synthesize CDK stacks (dev)
        working-directory: infra
        run: npx cdk synth --context environment=dev --quiet

      - name: Synthesize CDK stacks (staging)
        working-directory: infra
        run: npx cdk synth --context environment=staging --quiet

      - name: Synthesize CDK stacks (prod)
        working-directory: infra
        run: npx cdk synth --context environment=prod --quiet

      - name: Upload CloudFormation templates
        uses: actions/upload-artifact@v7
        with:
          name: cdk-templates
          path: infra/cdk.out/*.template.json
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Create Lambda asset placeholder
        run: mkdir -p server/bin/Release/net10.0/linux-arm64/publish

      - name: Run integration tests
        working-directory: infra
        run: npm test -- --testPathPatterns=integration

  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Check for vulnerable packages
        working-directory: infra
        run: |
          echo "Scanning npm packages for known vulnerabilities..."
          AUDIT_JSON=$(npm audit --json 2>&1 || true)

          # Count fixable high/critical vulns (excludes bundled deps inside aws-cdk-lib
          # that cannot be overridden — e.g. fast-uri bundled in aws-cdk-lib tarball)
          UNFIXABLE=$(echo "$AUDIT_JSON" | node -e "
            let raw = '';
            process.stdin.on('data', d => raw += d);
            process.stdin.on('end', () => {
              try {
                const data = JSON.parse(raw);
                const vulns = data.vulnerabilities || {};
                const bad = Object.values(vulns).filter(v =>
                  ['high', 'critical'].includes(v.severity) &&
                  (v.nodes || []).every(n => n.includes('node_modules/aws-cdk-lib/node_modules/'))
                );
                process.stdout.write(bad.map(v => v.name + ' (' + v.severity + ') — bundled in aws-cdk-lib, cannot be overridden').join('\n'));
              } catch { process.stdout.write(''); }
            });
          " 2>/dev/null)

          FIXABLE=$(echo "$AUDIT_JSON" | node -e "
            let raw = '';
            process.stdin.on('data', d => raw += d);
            process.stdin.on('end', () => {
              try {
                const data = JSON.parse(raw);
                const vulns = data.vulnerabilities || {};
                const bad = Object.values(vulns).filter(v =>
                  ['high', 'critical'].includes(v.severity) &&
                  !(v.nodes || []).every(n => n.includes('node_modules/aws-cdk-lib/node_modules/'))
                );
                process.stdout.write(String(bad.length));
              } catch { process.stdout.write('0'); }
            });
          " 2>/dev/null)

          if [ -n "$UNFIXABLE" ]; then
            echo "::warning::Known bundled vulnerabilities in aws-cdk-lib (cannot be overridden — upgrade aws-cdk-lib when fixed upstream):"
            echo "$UNFIXABLE"
          fi

          if [ "${FIXABLE:-0}" -gt "0" ]; then
            echo "::error::High or critical severity vulnerabilities found in addressable npm packages"
            npm audit --audit-level=high
            exit 1
          fi

          echo "No addressable high/critical vulnerabilities found."

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Create Lambda asset placeholder
        run: mkdir -p server/bin/Release/net10.0/linux-arm64/publish

      - name: Build TypeScript
        working-directory: infra
        run: npm run build

      - name: Verify CDK app can be synthesized
        working-directory: infra
        run: npx cdk synth --quiet > /dev/null
