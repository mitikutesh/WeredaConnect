name: Infrastructure Tests (CDK)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-tests.yml'
  push:
    branches: [main, develop]
    paths:
      - 'infra/**'
  workflow_call:  # Allow this workflow to be called from pr-validation.yml

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Create Lambda asset placeholder
        run: mkdir -p server/bin/Release/net10.0/linux-arm64/publish

      - name: Run linter
        working-directory: infra
        run: npm run lint

      - name: Run unit tests
        working-directory: infra
        run: npm test -- --coverage --testPathPatterns=unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./infra/coverage/lcov.info
          flags: infra-unit
          name: infra-unit-tests
          fail_ci_if_error: false

  snapshot-tests:
    name: Snapshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Run snapshot tests
        working-directory: infra
        run: npm test -- --testPathPatterns=snapshot

      - name: Check for snapshot changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only | grep -q "\.snap$"; then
            echo "⚠️ Snapshot files have changed. Please review carefully."
            git diff --name-only | grep "\.snap$"
          fi

  synth-validation:
    name: CDK Synth Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Create Lambda asset placeholder
        run: mkdir -p server/bin/Release/net10.0/linux-arm64/publish

      - name: Build TypeScript
        working-directory: infra
        run: npm run build

      - name: Synthesize CDK stacks (dev)
        working-directory: infra
        run: npx cdk synth --context environment=dev --quiet

      - name: Synthesize CDK stacks (staging)
        working-directory: infra
        run: npx cdk synth --context environment=staging --quiet

      - name: Synthesize CDK stacks (prod)
        working-directory: infra
        run: npx cdk synth --context environment=prod --quiet

      - name: Upload CloudFormation templates
        uses: actions/upload-artifact@v7
        with:
          name: cdk-templates
          path: infra/cdk.out/*.template.json
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Create Lambda asset placeholder
        run: mkdir -p server/bin/Release/net10.0/linux-arm64/publish

      - name: Run integration tests
        working-directory: infra
        run: npm test -- --testPathPatterns=integration

  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Check for vulnerable packages
        working-directory: infra
        run: |
          echo "Scanning npm packages for known vulnerabilities..."
          # FUP-13: fail closed. Only stdout is the report (npm writes warnings to stderr, and
          # mixing them in broke the JSON, which used to count as zero findings). npm audit
          # exits 1 when it finds anything, so its exit code is not the verdict; the parser is.
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" 2> "$RUNNER_TEMP/npm-audit.err" || true
          node - "$RUNNER_TEMP/npm-audit.json" "$RUNNER_TEMP/npm-audit.err" <<'EOF'
          const fs = require('fs');
          const [reportPath, errPath] = process.argv.slice(2);
          const fail = (why) => {
            console.log(`::error::npm audit gave no usable report (${why}); failing closed.`);
            const err = fs.existsSync(errPath) ? fs.readFileSync(errPath, 'utf8').trim() : '';
            if (err) console.log(err.slice(0, 4000));
            process.exit(1);
          };
          let data;
          try {
            data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          } catch (e) {
            fail(`output is not JSON: ${e.message}`);
          }
          if (data === null || typeof data !== 'object' || data.error) {
            fail(`npm reported an error: ${JSON.stringify(data && data.error).slice(0, 500)}`);
          }
          if (data.auditReportVersion !== 2) fail(`unknown auditReportVersion ${data.auditReportVersion}`);
          const vulns = data.vulnerabilities;
          const counts = data.metadata && data.metadata.vulnerabilities;
          if (vulns === null || typeof vulns !== 'object' || !counts || typeof counts !== 'object') {
            fail('no vulnerabilities map or metadata counts');
          }
          const severe = Object.values(vulns).filter((v) => v && ['high', 'critical'].includes(v.severity));
          const expected = Number(counts.high) + Number(counts.critical);
          if (!Number.isInteger(expected) || severe.length !== expected) {
            fail(`${severe.length} high/critical entries but metadata counts ${counts.high} high, ${counts.critical} critical`);
          }
          // Only a finding whose every install path is inside aws-cdk-lib's own bundled
          // node_modules cannot be overridden here. An entry with no paths is not bundled.
          const bundled = (v) =>
            Array.isArray(v.nodes) && v.nodes.length > 0 &&
            v.nodes.every((n) => n.includes('node_modules/aws-cdk-lib/node_modules/'));
          const unfixable = severe.filter(bundled);
          const fixable = severe.filter((v) => !bundled(v));
          if (unfixable.length > 0) {
            console.log('::warning::Known bundled vulnerabilities in aws-cdk-lib (cannot be overridden here; upgrade aws-cdk-lib when fixed upstream):');
            for (const v of unfixable) console.log(`${v.name} (${v.severity}), bundled in aws-cdk-lib`);
          }
          if (fixable.length > 0) {
            console.log('::error::High or critical severity vulnerabilities found in addressable npm packages:');
            for (const v of fixable) console.log(`${v.name} (${v.severity}): ${(v.nodes || []).join(', ') || 'no install path reported'}`);
            process.exit(1);
          }
          console.log(`No addressable high/critical vulnerabilities found (${counts.total} findings below high or bundled).`);
          EOF

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Create Lambda asset placeholder
        run: mkdir -p server/bin/Release/net10.0/linux-arm64/publish

      - name: Build TypeScript
        working-directory: infra
        run: npm run build

      - name: Verify CDK app can be synthesized
        working-directory: infra
        run: npx cdk synth --quiet > /dev/null
