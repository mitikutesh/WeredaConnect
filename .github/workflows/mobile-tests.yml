name: Mobile Tests (Flutter)

on:
  workflow_call:  # Called from pr-validation.yml for PR checks
  workflow_dispatch:  # Allow manual triggering for debugging

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: |
          for i in 1 2 3; do
            flutter pub get && break
            echo "Attempt $i failed, retrying in 5s..." && sleep 5
          done

      - name: Verify dependencies
        working-directory: mobile
        run: flutter pub get --offline

      - name: Run code generation
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --fatal-infos

      - name: Check formatting
        working-directory: mobile
        run: dart format --set-exit-if-changed .

      - name: Check live TLS chains against the bundled Amazon roots (CA pinning)
        run: ./scripts/check_cert_pins.sh

      - name: Stage Isar native library for unit tests
        working-directory: mobile
        run: cp $(find $HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-*/linux -name "libisar.so" | head -1) .

      - name: Run unit tests
        working-directory: mobile
        run: flutter test --coverage --reporter expanded

      # @TestOn('browser') files are skipped by the VM run above.
      - name: Run browser-only unit tests (Chrome)
        working-directory: mobile
        run: flutter test --platform chrome test/core/auth/fayda_callback_links_web_test.dart --reporter expanded

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./mobile/coverage/lcov.info
          flags: mobile-unit
          name: mobile-unit-tests
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb libsecret-1-dev gnome-keyring dbus-x11

      - name: Enable Linux desktop
        working-directory: mobile
        run: flutter config --enable-linux-desktop

      - name: Create Linux platform files
        working-directory: mobile
        run: flutter create --platforms=linux .

      - name: Get dependencies
        working-directory: mobile
        run: |
          for i in 1 2 3; do
            flutter pub get && break
            echo "Attempt $i failed, retrying in 5s..." && sleep 5
          done

      - name: Run code generation
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Start D-Bus session and unlock keyring
        run: |
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo -n "" | gnome-keyring-daemon --unlock --components=secrets

      - name: Run integration tests on Linux with virtual display
        working-directory: mobile
        run: |
          EXIT_CODE=0
          for test_file in integration_test/*_test.dart; do
            # Skip manual stress test (not for CI)
            if echo "$test_file" | grep -q "manual_stress_test"; then
              echo "=== Skipping: $test_file (manual only) ==="
              continue
            fi
            echo "=== Running: $test_file ==="
            xvfb-run -a flutter test "$test_file" -d linux --reporter expanded || EXIT_CODE=1
          done
          exit $EXIT_CODE

  build-apk:
    name: Build APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # No Android SDK cache step here on purpose. The SDK is preinstalled on
      # ubuntu-latest, a cache saved by a pull_request run is scoped to that PR
      # and is never restored by any other PR, and saving the multi-GB SDK dirs
      # in the post-job step took 5 to 10 minutes, which pushed this job past its
      # timeout on most mobile PRs. Gradle caching comes from setup-java above.

      - name: Get dependencies
        working-directory: mobile
        run: |
          for i in 1 2 3; do
            flutter pub get && break
            echo "Attempt $i failed, retrying in 5s..." && sleep 5
          done

      - name: Run code generation
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: |
          for i in 1 2 3; do
            flutter pub get && break
            echo "Attempt $i failed, retrying in 5s..." && sleep 5
          done

      - name: Run code generation
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run smoke tests
        working-directory: mobile
        run: flutter test test/smoke/ --reporter expanded
