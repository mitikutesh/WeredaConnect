name: Mobile Tests (Flutter)

on:
  workflow_call:  # Called from pr-validation.yml for PR checks
  workflow_dispatch:  # Allow manual triggering for debugging

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify dependencies
        working-directory: mobile
        run: flutter pub get --offline

      - name: Run code generation
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --fatal-infos

      - name: Check formatting
        working-directory: mobile
        run: dart format --set-exit-if-changed .

      - name: Run unit tests
        working-directory: mobile
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./mobile/coverage/lcov.info
          flags: mobile-unit
          name: mobile-unit-tests
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb

      - name: Enable Linux desktop
        working-directory: mobile
        run: flutter config --enable-linux-desktop

      - name: Create Linux platform files
        working-directory: mobile
        run: flutter create --platforms=linux .

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run code generation
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run integration tests on Linux with virtual display
        working-directory: mobile
        run: xvfb-run -a flutter test integration_test/ -d linux --reporter expanded

  build-apk:
    name: Build APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-${{ runner.os }}-${{ hashFiles('mobile/android/app/build.gradle') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run code generation
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run code generation
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run smoke tests
        working-directory: mobile
        run: flutter test test/smoke/ --reporter expanded

