# Gitleaks configuration for WeredaConnect
# Extends the default ruleset with project-specific settings

title = "WeredaConnect Secret Detection"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
    '''node_modules/''',
    '''.dart_tool/''',
    '''build/''',
    '''bin/''',
    '''obj/''',
    '''cdk\.out/''',
    '''\.github/DEPENDABOT_QUICK_REFERENCE\.md''',
    '''dist/''',
    '''docs/developer/api-reference\.md''',
    '''specs/contracts/.*\.md''',
    '''server/\.idea/''',
    '''__snapshots__/''',
    '''mobile/integration_test/.*_test\.dart''',  # Allow test fixtures in integration tests
    '''mobile/test/.*_test\.dart''',              # Allow test fixtures in unit tests
]

# Allow test fixtures and documentation examples
regexTarget = "line"
regexes = [
    '''EXAMPLE_KEY_DO_NOT_USE''',
    '''test-secret-placeholder''',
    '''QR-\d{5}-[A-Z]{5}''',           # QR token test fixtures (e.g., QR-12345-ABCDE)
    '''TB-\d{8}-\d{5}''',              # Telebirr reference test fixtures (e.g., TB-20260214-12345)
    '''qrToken = ['"]QR-''',           # QR token assignments in tests
    '''telebirrRef = ['"]TB-''',       # Telebirr ref assignments in tests
]
