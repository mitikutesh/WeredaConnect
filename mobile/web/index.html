<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline-first agritech logistics for Ethiopian rural communities">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WeredaConnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WeredaConnect</title>
  <link rel="manifest" href="manifest.json">

  <!-- The loading splash: on a 3G link the app's code takes most of a
       minute to arrive, and the page was white until then. This shows at
       once (no file to fetch: inline style, inline mark, system fonts) and
       leaves on Flutter's first frame. Flutter replaces this viewport tag
       with its own when it starts. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    #wc-splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 24px;
      background: #F5F4EE;
      color: #15201A;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans",
        "Noto Sans Ethiopic", "Nyala", "Ebrima", "Kefa", sans-serif;
      text-align: center;
    }
    #wc-splash .wc-mark {
      width: 56px;
      height: 56px;
      border-radius: 17px;
      background: #1E5B3E;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    #wc-splash .wc-name {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 800;
    }
    #wc-splash p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: #4A544E;
    }
    #wc-splash .wc-bar {
      width: 120px;
      height: 4px;
      margin-top: 14px;
      border-radius: 2px;
      background: #E3EEE6;
      overflow: hidden;
    }
    #wc-splash .wc-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #1E5B3E;
      animation: wc-slide 1.2s ease-in-out infinite;
    }
    @keyframes wc-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #wc-splash .wc-bar::after { animation: none; width: 100%; }
    }
    #wc-splash.wc-failed .wc-bar { display: none; }
    #wc-splash.wc-failed p { color: #7A1C14; }
  </style>
</head>
<body>
  <div id="wc-splash" role="status">
    <div class="wc-mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#FFFFFF">
        <path d="M19 15.18V7c0-2.21-1.79-4-4-4s-4 1.79-4 4v10c0 1.1-.9 2-2 2s-2-.9-2-2V8.82C8.16 8.4 9 7.3 9 6c0-1.66-1.34-3-3-3S3 4.34 3 6c0 1.3.84 2.4 2 2.82V17c0 2.21 1.79 4 4 4s4-1.79 4-4V7c0-1.1.9-2 2-2s2 .9 2 2v8.18c-1.16.41-2 1.51-2 2.82 0 1.66 1.34 3 3 3s3-1.34 3-3c0-1.3-.84-2.4-2-2.82z"/>
      </svg>
    </div>
    <h1 class="wc-name">WeredaConnect</h1>
    <p lang="en">Loading…</p>
    <p lang="am">በመጫን ላይ…</p>
    <p lang="om">Fe'amaa jira…</p>
    <div class="wc-bar" aria-hidden="true"></div>
  </div>
  <script>
    (function () {
      // If the app cannot start (an error before its first frame: a script
      // that fails to download, CanvasKit, or Dart main throwing), say so
      // instead of "Loading" forever. The capture phase also sees a
      // <script> that fails to load, which does not bubble. The first
      // frame still removes the splash.
      var failed = {
        en: 'Could not start. Reload the page.',
        am: 'መጀመር አልተቻለም። ገጹን እንደገና ይጫኑ።',
        om: "Jalqabuu hin dandeenye. Fuula irra deebi'aa fe'aa."
      };
      function onFailure() {
        var splash = document.getElementById('wc-splash');
        if (!splash || splash.classList.contains('wc-failed')) return;
        splash.classList.add('wc-failed');
        var lines = splash.querySelectorAll('p[lang]');
        for (var i = 0; i < lines.length; i++) {
          lines[i].textContent = failed[lines[i].getAttribute('lang')];
        }
      }
      function onFirstFrame() {
        window.removeEventListener('error', onFailure, true);
        window.removeEventListener('unhandledrejection', onFailure);
        var splash = document.getElementById('wc-splash');
        if (splash) splash.remove();
      }
      window.addEventListener('error', onFailure, true);
      window.addEventListener('unhandledrejection', onFailure);
      window.addEventListener('flutter-first-frame', onFirstFrame, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
