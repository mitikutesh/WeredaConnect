name: wereda_connect
description: Offline-first agritech logistics platform for Ethiopian rural communities
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database & Storage
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Networking & Sync
  dio: ^5.4.0
  connectivity_plus: ^7.0.0
  retry: ^3.1.0

  # Cryptography
  cryptography: ^2.7.0

  # Identifiers
  uuid: ^4.0.0

  # State Management
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5
  provider: ^6.1.0

  # Localization
  intl: any # version provided by flutter_localizations

  # UI & UX
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # F-12: Delivery Verification
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0

  # Audio Recording & Playback
  record: ^6.2.0
  just_audio: ^0.10.5
  audio_session: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Testing
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.0
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

  # Code Generation
  isar_generator: ^3.1.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true  # Enable l10n code generation

  # Assets
  # assets:
  #   - assets/images/

