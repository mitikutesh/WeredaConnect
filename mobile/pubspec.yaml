name: wereda_connect
description: Offline-first agritech logistics platform for Ethiopian rural communities
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database & Storage
  isar: ^4.0.0
  isar_flutter_libs: ^4.0.0
  path_provider: ^2.1.0

  # Networking & Sync
  dio: ^5.4.0
  connectivity_plus: ^5.0.0
  retry: ^3.1.0

  # State Management
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5

  # Localization
  intl: ^0.19.0

  # UI & UX
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  isar_generator: ^4.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true  # Enable l10n code generation

  # Assets
  # assets:
  #   - assets/images/
  #   - assets/icons/

