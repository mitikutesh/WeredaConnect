name: wereda_connect
description: Offline-first agritech logistics platform for Ethiopian rural communities
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Database & Storage
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.6
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.5

  # Networking & Sync
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  retry: ^3.1.0

  # Cryptography
  cryptography: ^2.7.0

  # Identifiers
  uuid: ^4.6.0

  # State Management
  flutter_bloc: ^8.1.0
  equatable: ^3.0.0
  provider: ^6.1.0

  # Async utilities (StreamGroup for merging Isar watch streams)
  async: ^2.13.1

  # Routing (web-friendly)
  go_router: ^14.0.0

  # Localization
  intl: any # version provided by flutter_localizations

  # UI & UX
  flutter_svg: ^2.3.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # F-12: Delivery Verification
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  geolocator: ^13.0.2
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1

  # Audio Recording & Playback
  record: ^6.2.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4

  # Fayda OIDC deep link + browser launch
  url_launcher: ^6.3.2
  app_links: ^6.0.0

  # Device authentication (biometric or PIN/pattern fallback): QR delivery
  # confirm gate + app lock. Android/iOS only; guarded by kIsWeb on web.
  local_auth: ^2.3.0

  # Push notifications (Android via FCM → AWS SNS). Android-only; never
  # compiled into the web build (main_web.dart doesn't reference them).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Web platform
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Testing
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.0

  # Code Generation
  isar_generator: ^3.1.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true  # Enable l10n code generation

  # Assets
  assets:
    - assets/data/ethiopia_woredas.json

  # Fonts — Noto Sans (Latin) + Noto Sans Ethiopic (Amharic fidäl),
  # bundled so all three languages render identically on every device
  # and offline (design brief 2026-07-06). Weights match the type
  # scale: 400 / 600 / 700.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
        - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
