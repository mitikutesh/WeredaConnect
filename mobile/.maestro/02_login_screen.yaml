appId: et.wereda.connect
name: "02 - Login Screen UI"
---

# Clear app data for fresh start
- clearState
- launchApp

# Navigate past splash
- tapOn: "Get Started"

# Tap Login on welcome screen
- tapOn: "Login"

# Login screen should show
- assertVisible: "Welcome to WeredaConnect"
- assertVisible: "Phone Number"
- assertVisible: "Password"

# Verify phone number field has +251 prefix
- assertVisible: "+251"

# Test form validation - submit empty form (tap the Login button in app bar area)
- tapOn: "Login"

# Take screenshot showing login screen
- takeScreenshot: "02_login_screen"

# Fill phone number field
- tapOn: "Phone Number"
- eraseText
- inputText: "+251912345678"

# Fill password field
- tapOn: "Password"
- inputText: "testpass1"
- hideKeyboard

# Take screenshot of filled form
- takeScreenshot: "02_login_filled"

# Verify forgot password link exists
- assertVisible: "Forgot Password?"

# Test forgot password dialog
- tapOn: "Forgot Password?"
- assertVisible: "OK"
- tapOn: "OK"

# Scroll down to see "Don't have account" + Register link
- scrollUntilVisible:
    element: "Don't have an account?"
    direction: DOWN

- assertVisible: "Don't have an account?"

# Take final screenshot
- takeScreenshot: "02_login_complete"
