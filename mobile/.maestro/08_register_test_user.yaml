appId: et.wereda.connect
name: "08 - Register Fresh Test User"
---

# Clear app data for fresh start
- clearState
- launchApp

# Navigate past splash
- tapOn: "Get Started"

# Tap "Sign Up" on welcome screen
- tapOn: "Sign Up"

# Step 1: Select Farmer role
- tapOn:
    point: "50%,30%"
- tapOn: "Continue"

# Step 2: Skip Fayda
- tapOn: "Continue"

# Step 3: Personal Info
- assertVisible: "Personal Info"

# Fill phone number (unique number)
- tapOn: "Phone Number"
- eraseText
- inputText: "+251900000099"
- hideKeyboard

# Fill display name
- tapOn: "Display Name"
- inputText: "Maestro Farmer"
- hideKeyboard

# Fill Wereda
- tapOn:
    point: "50%,47%"
- inputText: "Bole"
- hideKeyboard

# Fill password
- tapOn: "Password"
- inputText: "maestro1pass"
- hideKeyboard

# Fill confirm password
- tapOn: "Confirm Password"
- inputText: "maestro1pass"
- hideKeyboard

# Tap Sign Up
- tapOn: "Sign Up"

# Wait for registration + auto-login
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000

# Take screenshot - should be on home dashboard now
- takeScreenshot: "08_home_after_register"
