appId: et.wereda.connect
name: "03 - Registration Multi-Step Flow (Farmer)"
---

# Clear app data for fresh start
- clearState
- launchApp

# Navigate past splash to welcome
- tapOn: "Get Started"

# Tap "Sign Up" on welcome screen
- tapOn: "Sign Up"

# Step 1: Role Selection
- assertVisible: "Register"
- assertVisible: "Select Role"

# Take screenshot of role selection
- takeScreenshot: "03_role_selection"

# Select "Farmer" role - tap on the first role card
- tapOn:
    point: "50%,30%"

# Continue button should be enabled now
- tapOn: "Continue"

# Step 2: Fayda eKYC verification
- takeScreenshot: "03_fayda_step"

# Skip Fayda verification - tap Continue
- tapOn: "Continue"

# Step 3: Personal Info (farmers skip role details)
- assertVisible: "Personal Info"

# Take screenshot of personal info form
- takeScreenshot: "03_personal_info"

# Fill in personal info form
- tapOn: "Phone Number"
- eraseText
- inputText: "+251912345678"
- hideKeyboard

- tapOn: "Display Name"
- inputText: "Test Farmer"
- hideKeyboard

# Tap Wereda field by tapping on point where it's visible
- tapOn:
    point: "50%,47%"
- inputText: "Addis Ketema"
- hideKeyboard

# Tap Password field
- tapOn: "Password"
- inputText: "testpass1"
- hideKeyboard

# Tap Confirm Password field
- tapOn: "Confirm Password"
- inputText: "testpass1"
- hideKeyboard

# Take screenshot of filled form
- takeScreenshot: "03_personal_info_filled"

# The "Sign Up" button should appear at the bottom
- assertVisible: "Sign Up"
