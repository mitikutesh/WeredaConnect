<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New buying intent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5B3E}a:hover{color:#15402B}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F5F4EE; color: #15201A; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <a href="Market.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; color: #15201A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em">What do you need?</h1>
    <p style="margin: 0; font-size: 15px; color: #5E6862">Tell us what you're looking for and we'll find matches</p>
  </div>

  <form style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <fieldset style="margin: 0; padding: 0; border: none">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: #3F4843">Select Crop Type</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <label style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Teff</label>
        <label style="height: 40px; padding: 0 14px; border-radius: 999px; background: #2E4C7D; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800"><input type="radio" name="crop" checked style="position: absolute; opacity: 0; width: 1px; height: 1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Wheat</label>
        <label style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Barley</label>
        <label style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Maize</label>
        <label style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Chickpea</label>
        <label style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Lentils</label>
        <label style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Sorghum</label>
        <label style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Coffee</label>
        <label style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Sesame</label>
      </div>
    </fieldset>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Quantity needed (quintals)
        <input type="text" inputmode="decimal" value="20" style="height: 48px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; font: 700 17px Manrope, sans-serif; color: #15201A">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Maximum price (ETB/kg)
        <input type="text" inputmode="decimal" value="45" style="height: 48px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; font: 700 17px Manrope, sans-serif; color: #15201A">
      </label>
    </div>
    <span style="font-size: 12px; color: #5E6862; margin-top: -8px">Price is optional. Leave it empty to see all prices.</span>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Deliver to
      <span style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: #15201A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Merkato, Addis Ababa</span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Needed by (optional)
      <span style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; color: #15201A">Fri 31 Oct<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4z"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span>
      <span style="font-size: 12px; font-weight: 500; color: #5E6862">We'll prefer transport that can deliver in time</span>
    </label>
  </form>

  <div style="margin-top: auto; padding: 0 20px 28px; display: flex; flex-direction: column; gap: 8px">
    <a href="Market.dc.html" style="height: 56px; border-radius: 16px; background: #1E5B3E; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Find Matches</a>
    <span style="text-align: center; font-size: 12px; color: #5E6862">Saving this request lets us alert you when new matches arrive</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
