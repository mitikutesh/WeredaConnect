<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create crop listing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5B3E}a:hover{color:#15402B}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F5F4EE; color: #15201A; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px; display: flex; align-items: center; gap: 14px">
    <a href="FarmerHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; color: #15201A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Create Listing</h1>
  </div>

  <form style="padding: 0 20px; display: flex; flex-direction: column; gap: 18px">
    <fieldset style="margin: 0; padding: 0; border: none">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: #3F4843">Select Crop Type</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <label style="height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Teff</label>
        <label style="height: 46px; border-radius: 14px; background: #1E5B3E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 800"><input type="radio" name="crop" checked style="position: absolute; opacity: 0; width: 1px; height: 1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Wheat</label>
        <label style="height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Barley</label>
        <label style="height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Maize</label>
        <label style="height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Chickpea</label>
        <label style="height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Lentils</label>
        <label style="height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Sorghum</label>
        <label style="height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Coffee</label>
        <label style="height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600"><input type="radio" name="crop" style="position: absolute; opacity: 0; width: 1px; height: 1px">Sesame</label>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Quantity (quintals)
        <span style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between"><input type="text" inputmode="decimal" value="40" aria-label="Quantity in quintals" style="width: 60px; border: none; background: transparent; font: 700 18px Manrope, sans-serif; color: #15201A; outline: none"><span style="font-size: 13px; font-weight: 600; color: #5E6862">q</span></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Price (ETB/kg)
        <span style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between"><input type="text" inputmode="decimal" value="42" aria-label="Price in ETB per kg" style="width: 60px; border: none; background: transparent; font: 700 18px Manrope, sans-serif; color: #15201A; outline: none"><span style="font-size: 13px; font-weight: 600; color: #5E6862">ETB/kg</span></span>
      </label>
    </div>

    <section aria-label="Location" style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700; color: #3F4843">Location</span>
      <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E1D8; overflow: hidden">
        <svg width="100%" height="128" viewBox="0 0 350 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Your farm near Meki, drawn from the place list on the phone" style="display: block">
          <rect width="350" height="128" fill="#E9E7DE"/>
          <ellipse cx="250" cy="40" rx="40" ry="16" fill="#CFDDE3"/>
          <ellipse cx="90" cy="96" rx="80" ry="34" fill="#DCE5D2"/>
          <g fill="#A7ADA9"><circle cx="40" cy="30" r="3"/><circle cx="300" cy="96" r="3"/><circle cx="200" cy="110" r="3"/><circle cx="120" cy="20" r="3"/></g>
          <circle cx="232" cy="78" r="4" fill="#7A827D"/>
          <circle cx="160" cy="66" r="18" fill="#1E5B3E" fill-opacity="0.14"/>
          <circle cx="160" cy="66" r="8" fill="#FFFFFF" stroke="#1E5B3E" stroke-width="4"/>
          <g font-family="Manrope, sans-serif" font-size="11" font-weight="600" fill="#3F4843" stroke="#E9E7DE" stroke-width="3" paint-order="stroke">
            <text x="176" y="62">Your farm</text>
            <text x="240" y="82">Meki</text>
            <text x="244" y="30">Lake Ziway</text>
          </g>
        </svg>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px">
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: #E3EEE6; color: #1E5B3E; font-size: 12px; font-weight: 700"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>GPS Captured · Meki, Oromia</span>
          <a href="#" style="font-size: 13px; font-weight: 700">Change</a>
        </div>
      </div>
      <span style="font-size: 12px; color: #5E6862">No GPS? Pick your wereda from the list instead.</span>
    </section>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Description
      <textarea rows="3" style="padding: 12px 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; font: 500 15px/1.45 Manrope, sans-serif; color: #15201A; resize: none">Clean and dry, in 100 kg sacks. Ready from Thursday.</textarea>
      <span style="font-size: 12px; font-weight: 500; color: #5E6862">No phone numbers: contact opens after payment is held in escrow.</span>
    </label>
  </form>

  <div style="margin-top: auto; padding: 0 20px 28px; display: flex; flex-direction: column; gap: 8px">
    <a href="MyCrops.dc.html" style="height: 56px; border-radius: 16px; background: #1E5B3E; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Save</a>
    <span style="text-align: center; font-size: 12px; color: #5E6862">Saved on your phone first, sent when you have network.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
