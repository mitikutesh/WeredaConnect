<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5410}a:hover{color:#6B400B}
</style>
</helmet>
<div style="width: 390px; height: 920px; box-sizing: border-box; background: #F5F4EE; color: #15201A; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px; display: flex; align-items: center; gap: 14px">
    <a href="TruckerHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1D8; color: #15201A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Create Trip</h1>
  </div>

  <form style="padding: 0 20px; display: flex; flex-direction: column; gap: 16px">
    <button type="button" style="align-self: flex-start; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px dashed #D9922B; background: #FAEED8; color: #6B400B; font: 700 13px Manrope, sans-serif; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6"/><path d="M5 15a8 8 0 1 0 2-9l-3 4"/></svg>Repeat Last Trip · Meki → Addis Ababa</button>

    <div style="position: relative; display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">From (Origin)
        <span style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: #15201A"><span style="width: 10px; height: 10px; border-radius: 999px; border: 3px solid #1E5B3E; box-sizing: border-box"></span>Meki <span style="font-size: 13px; font-weight: 500; color: #5E6862">· Oromia</span></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">To (Destination)
        <span style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: #15201A"><span style="width: 10px; height: 10px; border-radius: 999px; background: #2E4C7D"></span>Addis Ababa</span>
      </label>
      <button type="button" aria-label="Swap origin and destination" style="position: absolute; right: 12px; top: 52px; width: 44px; height: 44px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; color: #15201A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 4L4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/></svg></button>
    </div>

    <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E1D8; overflow: hidden">
      <svg width="100%" height="120" viewBox="0 0 350 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Route preview from Meki to Addis Ababa, drawn on the phone" style="display: block">
        <rect width="350" height="120" fill="#E9E7DE"/>
        <ellipse cx="110" cy="82" rx="26" ry="10" fill="#CFDDE3"/>
        <circle cx="306" cy="22" r="26" fill="#E0DCD0"/>
        <path d="M34 100 L306 22" stroke="#15201A" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="6 6"/>
        <g fill="#A7ADA9"><circle cx="86" cy="86" r="3.5"/><circle cx="150" cy="66" r="3.5"/><circle cx="196" cy="54" r="3.5"/><circle cx="240" cy="42" r="3.5"/></g>
        <circle cx="34" cy="100" r="8" fill="#FFFFFF" stroke="#1E5B3E" stroke-width="3.5"/>
        <circle cx="306" cy="22" r="8" fill="#2E4C7D"/>
        <g font-family="Manrope, sans-serif" font-size="11" font-weight="600" fill="#3F4843" stroke="#E9E7DE" stroke-width="3" paint-order="stroke">
          <text x="48" y="106">Meki</text>
          <text x="152" y="84">Mojo</text>
          <text x="246" y="60">Dukem</text>
          <text x="228" y="18">Addis Ababa</text>
        </g>
      </svg>
      <div style="display: flex; justify-content: space-between; padding: 10px 14px; font-size: 12px; color: #5E6862"><span>About 130 km · towns on the way, no download</span></div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Departure Date
      <span style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; color: #15201A">Thu 30 Oct 2026<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4z"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span>
      <span style="font-size: 12px; font-weight: 500; color: #5E6862">Buyers can book until 24 h before you leave.</span>
    </label>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Capacity (quintals)
        <input type="text" inputmode="decimal" value="50" style="height: 48px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; font: 700 17px Manrope, sans-serif; color: #15201A">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Price per Quintal (ETB)
        <input type="text" inputmode="decimal" value="150" style="height: 48px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; font: 700 17px Manrope, sans-serif; color: #15201A">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Vehicle Plate
        <input type="text" value="[PLATE]" style="height: 48px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; font: 600 16px Manrope, sans-serif; color: #15201A">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3F4843">Vehicle Description
        <input type="text" value="Isuzu FSR 5 t" style="height: 48px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3C8; background: #FFFFFF; font: 600 16px Manrope, sans-serif; color: #15201A">
      </label>
    </div>
  </form>

  <div style="margin-top: auto; padding: 0 20px 28px; display: flex; flex-direction: column; gap: 8px">
    <a href="TripDetail.dc.html" style="height: 56px; border-radius: 16px; background: #15201A; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Save</a>
    <span style="text-align: center; font-size: 12px; color: #5E6862">Saved on your phone first, sent when you have network.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
