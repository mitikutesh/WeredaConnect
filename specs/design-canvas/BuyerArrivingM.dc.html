<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Truck arriving</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#18775F}a:hover{color:#105443}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #DCD5C9; color: #1A1516; font-family: 'Bricolage Grotesque', 'Noto Sans Ethiopic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <svg width="390" height="460" sc-camel-view-box="0 0 390 460" role="img" aria-label="Map of Addis Ababa: the truck is inside the 5 km circle around Merkato" style="position: absolute; left: 0; top: 0">
    <rect width="390" height="460" fill="#DCD5C9"></rect>
    <g stroke="#EFEBE4" stroke-width="6" fill="none">
      <path d="M-10 120 C 100 130, 260 110, 400 130"></path>
      <path d="M-10 220 C 120 210, 260 236, 400 220"></path>
      <path d="M90 -10 C 100 120, 80 300, 100 470"></path>
      <path d="M320 -10 C 300 120, 330 300, 310 470"></path>
      <path d="M-10 330 C 120 340, 260 320, 400 340"></path>
    </g>
    <path d="M-10 470 C 40 410, 100 320, 150 250 C 180 210, 220 170, 250 150 C 290 124, 340 100, 400 80" stroke="#EFEBE4" stroke-width="13" fill="none" stroke-linecap="round"></path>
    <circle cx="250" cy="150" r="130" fill="#1A1516" fill-opacity="0.05" stroke="#5C5450" stroke-width="1.5" stroke-dasharray="5 5"></circle>
    <path d="M-10 470 C 40 410, 100 320, 150 250" stroke="#18775F" stroke-width="4" fill="none" stroke-linecap="round"></path>
    <path d="M150 250 C 180 210, 220 170, 250 150" stroke="#1A1516" stroke-opacity="0.55" stroke-width="2.5" fill="none" stroke-dasharray="6 6"></path>
    <circle cx="150" cy="250" r="12" fill="#F0873A" fill-opacity="0.16" stroke="#A85518" stroke-width="2" stroke-dasharray="3 4"></circle>
    <circle cx="44" cy="402" r="5" fill="#FFFFFF" stroke="#18775F" stroke-width="3"></circle>
    <circle cx="104" cy="314" r="5" fill="#FFFFFF" stroke="#F0873A" stroke-width="3"></circle>
    <circle cx="250" cy="150" r="13" fill="#1A1516"></circle>
    <circle cx="250" cy="150" r="5" fill="#FFFFFF"></circle>
    <g font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="700" fill="#4A4340" stroke="#DCD5C9" stroke-width="3" paint-order="stroke">
      <text x="56" y="408">Akaki 13:15</text>
      <text x="116" y="320">13:30</text>
      <text x="268" y="146">Merkato · you</text>
      <text x="330" y="214" fill="#5C5450">5 km</text>
    </g>
  </svg>
  <div style="position: absolute; left: 130px; top: 230px; width: 40px; height: 40px; border-radius: 12px; background: #1A1516; color: #F0873A; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(26,21,22,0.25)"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3z"></path><path d="M14 10h4l3 3v3h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg></div>
  <div style="position: absolute; left: 178px; top: 252px; padding: 7px 10px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 6px 16px rgba(26,21,22,0.14); display: flex; flex-direction: column; gap: 1px; white-space: nowrap"><span style="font-size: 13px; font-weight: 800">13:38 · Nifas Silk</span><span style="font-size: 13px; font-weight: 500">3 min ago · 3.2 km away</span></div>

  <div style="position: relative; padding: 20px; display: flex; justify-content: space-between; align-items: center">
    <a href="BuyerLiveTripM.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #F5F3F1; color: #1A1516; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(26,21,22,0.14)"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21V3"></path><path d="M12 9c-2.6 0-4-1.4-4-4 2.6 0 4 1.4 4 4z"></path><path d="M12 9c2.6 0 4-1.4 4-4-2.6 0-4 1.4-4 4z"></path><path d="M12 15c-2.6 0-4-1.4-4-4 2.6 0 4 1.4 4 4z"></path><path d="M12 15c2.6 0 4-1.4 4-4-2.6 0-4 1.4-4 4z"></path></svg>Wheat · 2,000 kg</span>
    <span aria-hidden="true" style="width: 44px"></span>
  </div>

  <div style="margin-top: auto; position: relative; background: #F5F3F1; border-radius: 28px 28px 0 0; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -14px 30px rgba(26,21,22,0.14)">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 999px; background: #C9BDB5; align-self: center"></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 999px; background: #E3F0EB; color: #18775F; font-size: 12px; font-weight: 800"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #18775F"></span>Arriving</span>
      <h1 style="margin: 0; font-size: 28px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em">Dawit is about 10 min away</h1>
      <div style="font-size: 14px; font-weight: 500; color: #5C5450">Checked in 3 min ago, 3.2 km from Merkato</div>
    </div>

    <fieldset style="margin: 0; padding: 14px 16px 6px; border: none; border-radius: 24px; background: #E4D5C7; display: flex; flex-direction: column; gap: 0">
      <legend style="float: left; padding: 0; margin-bottom: 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #4A4340">Before you scan</legend>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; min-height: 44px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #1A1516">Count the sacks: 20 × 100 kg</label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; min-height: 44px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #1A1516">Check the wheat is dry and clean</label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; min-height: 44px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #1A1516">Weigh a few sacks if you can</label>
    </fieldset>

    <div style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.45; color: #4A4340"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#18775F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M6 11h12v9H6z"></path><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg><span>Scanning confirms delivery. Almaz and Dawit are paid after a 48 h check window, unless you report a problem.</span></div>

    <div style="display: flex; gap: 10px">
      <a href="BuyerDeliveredM.dc.html" style="flex-grow: 1; height: 54px; border-radius: 999px; background: #F0873A; color: #1A1516; text-decoration: none; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"></path></svg>Scan driver's QR</a>
      <button type="button" aria-label="Call Dawit" style="height: 54px; padding: 0 20px 0 16px; border-radius: 999px; border: none; background: #1A1516; color: #FFFFFF; font: 800 15px 'Bricolage Grotesque', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Call</button>
    </div>
  </div>
</div>
</x-dc>
