<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Welcome and login</title>

</head>
<body>
<x-dc>

<style>

</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #FFFFFF; color: #1A1516; font-family: 'Bricolage Grotesque', 'Noto Sans Ethiopic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="position: relative; padding: 24px 20px 24px; border-radius: 0 0 28px 28px; background: {{soft}}; color: #1A1516; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 40px; height: 40px; border-radius: 14px; background: #FFFFFF; color: {{primary}}; display: flex; align-items: center; justify-content: center"><svg width="25" height="25" sc-camel-view-box="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.5,12c0.93,0,1.78,0.28,2.5,0.76V8c0-1.1-0.9-2-2-2h-6.29l-1.06-1.06l1.41-1.41l-0.71-0.71L9.82,6.35l0.71,0.71l1.41-1.41L13,6.71V9c0,1.1-0.9,2-2,2h-0.54c0.95,1.06,1.54,2.46,1.54,4c0,0.34-0.04,0.67-0.09,1h3.14C15.3,13.75,17.19,12,19.5,12z"></path><path d="M19.5,13c-1.93,0-3.5,1.57-3.5,3.5s1.57,3.5,3.5,3.5s3.5-1.57,3.5-3.5S21.43,13,19.5,13z M19.5,18c-0.83,0-1.5-0.67-1.5-1.5s0.67-1.5,1.5-1.5s1.5,0.67,1.5,1.5S20.33,18,19.5,18z"></path><path d="M4,9h5c0-1.1-0.9-2-2-2H4C3.45,7,3,7.45,3,8C3,8.55,3.45,9,4,9z"></path><path d="M9.83,13.82l-0.18-0.47L10.58,13c-0.46-1.06-1.28-1.91-2.31-2.43l-0.4,0.89l-0.46-0.21l0.4-0.9C7.26,10.13,6.64,10,6,10c-0.53,0-1.04,0.11-1.52,0.26l0.34,0.91l-0.47,0.18L4,10.42c-1.06,0.46-1.91,1.28-2.43,2.31l0.89,0.4l-0.21,0.46l-0.9-0.4C1.13,13.74,1,14.36,1,15c0,0.53,0.11,1.04,0.26,1.52l0.91-0.34l0.18,0.47L1.42,17c0.46,1.06,1.28,1.91,2.31,2.43l0.4-0.89l0.46,0.21l-0.4,0.9C4.74,19.87,5.36,20,6,20c0.53,0,1.04-0.11,1.52-0.26l-0.34-0.91l0.47-0.18L8,19.58c1.06-0.46,1.91-1.28,2.43-2.31l-0.89-0.4l0.21-0.46l0.9,0.4C10.87,16.26,11,15.64,11,15c0-0.53-0.11-1.04-0.26-1.52L9.83,13.82z M7.15,17.77c-1.53,0.63-3.29-0.09-3.92-1.62c-0.63-1.53,0.09-3.29,1.62-3.92c1.53-0.63,3.29,0.09,3.92,1.62C9.41,15.38,8.68,17.14,7.15,17.77z"></path></svg></div>
        <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.02em">WeredaConnect</span>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; color: #1A1516; font-size: 12px; font-weight: 700"><svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{primary}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Offline Ready</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="max-width: 232px; font-size: 13px; font-weight: 500; color: #4A4340">{{line}}</span>
      <h1 style="margin: 0; max-width: 232px; font-size: 32px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em">Welcome to WeredaConnect</h1>
    </div>
    <sc-if value="{{farmerOn}}" hint-placeholder-val="{{false}}"><svg data-sketch="farmer" width="100" height="74" sc-camel-view-box="0 0 140 104" fill="none" stroke="#1A1516" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: 0.3; position: absolute; pointer-events: none; right: 18px; bottom: 22px"><path d="M140 4 C 112 14, 78 34, 48 72" stroke-width="2.2"></path><path d="M98 26 C 86 10, 66 6, 50 12 C 56 28, 78 36, 98 26 Z" stroke-width="2.0"></path><path d="M98 26 C 82 20, 66 15, 53 13" stroke-width="1.6"></path><path d="M76 44 C 92 46, 108 60, 110 78 C 92 78, 78 64, 76 44 Z" stroke-width="2.0"></path><path d="M76 44 C 88 54, 100 66, 108 76" stroke-width="1.6"></path><path d="M48 72 L 44 80" stroke-width="1.7"></path><path d="M48 72 L 56 82" stroke-width="1.7"></path><circle cx="42" cy="87" r="6.5" stroke-width="2.0"></circle><circle cx="58" cy="89" r="6.5" stroke-width="2.0"></circle></svg></sc-if>
    <sc-if value="{{truckerOn}}" hint-placeholder-val="{{false}}"><svg data-sketch="trucker" width="118" height="57" sc-camel-view-box="0 0 140 68" fill="none" stroke="#1A1516" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: 0.3; position: absolute; pointer-events: none; right: 18px; bottom: 22px"><path d="M4 62 C 46 58, 96 60, 138 56" stroke-width="1.5"></path><path d="M58 12 H 120 V 46 H 58 Z" stroke-width="1.7"></path><path d="M66 12 C 68 5, 78 5, 80 12" stroke-width="1.4"></path><path d="M82 12 C 84 4, 96 4, 98 12" stroke-width="1.4"></path><path d="M100 12 C 102 6, 112 6, 114 12" stroke-width="1.4"></path><path d="M58 22 L 40 22 C 36 22, 33 25, 31 30 L 27 40 L 27 46 L 120 46" stroke-width="1.7"></path><path d="M39 26 L 52 26 L 52 35 L 35 35 Z" stroke-width="1.4"></path><circle cx="44" cy="50" r="7" stroke-width="1.7"></circle><circle cx="104" cy="50" r="7" stroke-width="1.7"></circle><circle cx="44" cy="50" r="2" stroke-width="1.3"></circle><circle cx="104" cy="50" r="2" stroke-width="1.3"></circle></svg></sc-if>
    <sc-if value="{{buyerOn}}" hint-placeholder-val="{{false}}"><svg data-sketch="buyer" width="100" height="68" sc-camel-view-box="20 20 112 76" fill="none" stroke="#1A1516" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: 0.3; position: absolute; pointer-events: none; right: 18px; bottom: 22px"><path d="M58 92 L 96 92" stroke-width="1.6"></path><path d="M77 92 L 77 30" stroke-width="1.6"></path><circle cx="77" cy="26" r="3.5" stroke-width="1.6"></circle><path d="M40 38 L 114 34" stroke-width="1.6"></path><path d="M40 38 L 30 62" stroke-width="1.3"></path><path d="M40 38 L 50 62" stroke-width="1.3"></path><path d="M26 62 L 54 62 C 52 73, 28 73, 26 62 Z" stroke-width="1.6"></path><path d="M114 34 L 104 56" stroke-width="1.3"></path><path d="M114 34 L 124 56" stroke-width="1.3"></path><path d="M100 56 L 128 56 C 126 67, 102 67, 100 56 Z" stroke-width="1.6"></path><path d="M31 62 C 35 53, 45 53, 49 62" stroke-width="1.3"></path><circle cx="110" cy="51" r="4" stroke-width="1.3"></circle><circle cx="119" cy="51" r="4" stroke-width="1.3"></circle></svg></sc-if>
  </header>

  <div role="group" aria-label="Your role" style="padding: 16px 20px 0; display: flex; gap: 8px">
    <button type="button" onClick="{{pickFarmer}}" aria-pressed="{{farmerOn}}" style="flex: 1; height: 44px; padding: 0 10px; border: 1px solid {{farmerBd}}; border-radius: 999px; background: {{farmerBg}}; color: {{farmerFg}}; font: {{farmerWt}} 13px 'Bricolage Grotesque', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20v-8"></path><path d="M12 12c0-4 3-7 8-7 0 5-3 8-8 7z"></path><path d="M12 14c0-3-2.5-5.5-7-5.5 0 4 2.5 6 7 5.5z"></path></svg>Farmer</button>
    <button type="button" onClick="{{pickTrucker}}" aria-pressed="{{truckerOn}}" style="flex: 1; height: 44px; padding: 0 10px; border: 1px solid {{truckerBd}}; border-radius: 999px; background: {{truckerBg}}; color: {{truckerFg}}; font: {{truckerWt}} 13px 'Bricolage Grotesque', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3z"></path><path d="M14 10h4l3 3v3h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg>Trucker</button>
    <button type="button" onClick="{{pickBuyer}}" aria-pressed="{{buyerOn}}" style="flex: 1; height: 44px; padding: 0 10px; border: 1px solid {{buyerBd}}; border-radius: 999px; background: {{buyerBg}}; color: {{buyerFg}}; font: {{buyerWt}} 13px 'Bricolage Grotesque', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Buyer</button>
  </div>

  <form style="margin: 0; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <fieldset style="margin: 0; padding: 0; border: none; min-width: 0">
      <legend style="padding: 0; margin-bottom: 10px"><span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5C5450"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c3 3.5 3 14.500 0 18"></path><path d="M12 3c-3 3.5-3 14.500 0 18"></path></svg>Language</span></legend>
      <div style="display: flex; gap: 8px">
        <label style="position: relative; height: 44px; padding: 0 16px; cursor: pointer; box-sizing: border-box; border: 1px solid #1A1516; border-radius: 999px; background: #1A1516; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center"><input type="radio" name="lang" checked="" style="position: absolute; opacity: 0; width: 1px; height: 1px">English</label>
        <label lang="am" style="position: relative; height: 44px; padding: 0 16px; cursor: pointer; box-sizing: border-box; border: 1px solid #8E857E; border-radius: 999px; color: #4A4340; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center"><input type="radio" name="lang" style="position: absolute; opacity: 0; width: 1px; height: 1px">አማርኛ</label>
        <label lang="om" style="position: relative; height: 44px; padding: 0 16px; cursor: pointer; box-sizing: border-box; border: 1px solid #8E857E; border-radius: 999px; color: #4A4340; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center"><input type="radio" name="lang" style="position: absolute; opacity: 0; width: 1px; height: 1px">Afaan Oromoo</label>
      </div>
    </fieldset>
    <label style="margin-top: 4px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #4A4340">Phone Number
      <input type="tel" value="0911 234 567" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid #8F8780; background: #F5F3F1; font: 600 16px 'Bricolage Grotesque', sans-serif; color: #1A1516">
      <span style="font-size: 13px; font-weight: 500; color: #5C5450">Example: 0911234567 or +251911234567</span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #4A4340">Password
      <input type="password" value="password1" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid #8F8780; background: #F5F3F1; font: 600 16px 'Bricolage Grotesque', sans-serif; color: #1A1516">
    </label>
    <a href="#" style="align-self: flex-end; margin: -10px 0 -8px; min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 700; color: {{primary}}">Forgot Password?</a>
    <a href="#" style="height: 54px; border-radius: 999px; background: #F0873A; color: #1A1516; text-decoration: none; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{cta}}</a>
  </form>

  <div style="margin-top: auto; padding: 0 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <a href="RegisterRoleM.dc.html" style="height: 54px; width: 100%; box-sizing: border-box; border-radius: 999px; border: 1px solid #8E857E; background: transparent; color: #1A1516; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Don't have an account? Register</a>
    <span style="font-size: 13px; color: #5C5450">Payments held safely in escrow · Telebirr Payment</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["farmer","trucker","buyer"],"default":"farmer"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = {
      farmer:  { primary: '#9A45A0', dark: '#6B2A69', tint: '#F4E6F3', soft: '#E8CFE7', cta: 'Login as Farmer',  line: 'Sell your harvest and follow every order' },
      trucker: { primary: '#2B62C4', dark: '#1F4A96', tint: '#E4ECFA', soft: '#CDDCF6', cta: 'Login as Trucker', line: 'Fill your truck and get paid on delivery' },
      buyer:   { primary: '#18775F', dark: '#105443', tint: '#E3F0EB', soft: '#CDE5DC', cta: 'Login as Buyer',   line: 'Find crops and transport in one place' }
    };
    const role = (this.state && this.state.role) || this.props.role || 'farmer';
    const r = R[role] || R.farmer;
    const chip = (k) => role === k
      ? { bg: '#1A1516', fg: '#FFFFFF', bd: '#1A1516', wt: 700 }
      : { bg: 'transparent', fg: '#4A4340', bd: '#C9BDB5', wt: 500 };
    const f = chip('farmer'), t = chip('trucker'), b = chip('buyer');
    return {
      primary: r.primary, soft: r.soft, dark: r.dark, tint: r.tint, cta: r.cta, line: r.line,
      farmerBg: f.bg, farmerFg: f.fg, farmerBd: f.bd, farmerWt: f.wt, farmerOn: role === 'farmer',
      truckerBg: t.bg, truckerFg: t.fg, truckerBd: t.bd, truckerWt: t.wt, truckerOn: role === 'trucker',
      buyerBg: b.bg, buyerFg: b.fg, buyerBd: b.bd, buyerWt: b.wt, buyerOn: role === 'buyer',
      pickFarmer: () => this.setState({ role: 'farmer' }),
      pickTrucker: () => this.setState({ role: 'trucker' }),
      pickBuyer: () => this.setState({ role: 'buyer' })
    };
  }
}
</script>
</body></html>
